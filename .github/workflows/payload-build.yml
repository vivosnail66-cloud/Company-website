name: Payload CMS Build Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Payload Project
        run: npm run build
        env:
          PAYLOAD_SECRET: ci_build_secret_test_key_123456789
          DATABASE_URI: postgresql://postgres:postgres@localhost:5432/ci_test