name: Payload CMS Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gotocosmic_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gotocosmic_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_OPTIONS: --no-deprecation
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gotocosmic_ci
      PAYLOAD_SECRET: ci_payload_secret_for_github_actions
      CRON_SECRET: ci_cron_secret_for_github_actions
      PREVIEW_SECRET: ci_preview_secret_for_github_actions
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      PAYLOAD_DATABASE_PUSH: 'true'
      SKIP_PAYLOAD_STATIC_PARAMS: 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.17.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Payload import map
        run: pnpm generate:importmap

      - name: Generate Payload types
        run: pnpm generate:types

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Build Next.js and Payload CMS
        run: pnpm run build

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          network: host
          push: false
          tags: gotocosmic-cms:ci
          build-args: |
            DATABASE_URL=postgresql://postgres:postgres@localhost:5432/gotocosmic_ci
            PAYLOAD_SECRET=ci_payload_secret_for_github_actions
            CRON_SECRET=ci_cron_secret_for_github_actions
            PREVIEW_SECRET=ci_preview_secret_for_github_actions
            NEXT_PUBLIC_SERVER_URL=http://localhost:3000
            PAYLOAD_DATABASE_PUSH=true
            SKIP_PAYLOAD_STATIC_PARAMS=true