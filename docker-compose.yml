services:
  postgres:
    image: postgres:16
    container_name: gotocosmic-postgres
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gotocosmic
    volumes:
      - gotocosmic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gotocosmic']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gotocosmic_pgdata:
